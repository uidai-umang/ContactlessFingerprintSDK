plugins {
    alias(libs.plugins.android.library)
//    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.ksp)
    alias(libs.plugins.dagger.hilt)
    alias(libs.plugins.navigation.safeargs)

    id 'maven-publish'
}

android {
    namespace 'app.gov.uidai.registration'
    compileSdk 36

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")

    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream {
            localProperties.load(it)
        }
    }

    def backendUrl = providers.gradleProperty("BACKEND_URL")
            .orElse(localProperties.getProperty("BACKEND_URL", ""))
            .get()

    if (backendUrl.isBlank()) {
        throw new GradleException(
                "BACKEND_URL must be provided through Gradle properties or local.properties"
        )
    }

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

//        def localProperties = new Properties()
//        localProperties.load(new FileInputStream(rootProject.file("local.properties")))

        buildConfigField(
                "String",
                "BACKEND_URL",
                "\"${backendUrl}\""
        )    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
//    kotlinOptions {
//        jvmTarget = '11'
//    }

    kotlin {
        compilerOptions {
            languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
            // Optional: Set jvmTarget
            // jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    publishing {
        singleVariant("release")
//        singleVariant("debug")
    }

}
